<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILLU — Ding</title>
<meta name="description" content="Thanks for ringing the bell for ILLU's launch.">
<link rel="icon" href="../favicon.png">
<style>
@font-face{font-family:Onest;src:url(../assets/onest.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#F9FBF9;--card:#fff;--ink:#10241B;--ink2:#2C4438;--mu:#5E6E66;--line:#E1E8E2;--pr:#0B5D3B;--onpr:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F1714;--card:#17221D;--ink:#E8EFEA;--ink2:#C9D6CF;--mu:#9FB0A7;--line:#24322B;--pr:#7FDCAE;--onpr:#0B2A1C}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:18px;line-height:1.5}
.card{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 28px;text-align:center}
.card svg{color:var(--pr)}
h1{font-size:22px;margin:16px 0 10px}
p{margin:0 0 12px;color:var(--ink2)}
.mu{font-size:14.5px;color:var(--mu)}
a.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:14px;border-radius:24px;background:var(--pr);color:var(--onpr);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--pr);outline-offset:3px}
</style>
</head>
<body>
<div class="card">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
<h1>Ding. Thanks for ringing.</h1>
<p>Pre-registration on Google Play opens around 19 November. Come back then and tap Pre-register, and Google Play will tell you on launch day, 8 December.</p>
<p class="mu">We don’t ask for your email. Each ring is only counted.</p>
<a class="btn" href="/">Back to the site</a>
</div>
</body>
</html>
